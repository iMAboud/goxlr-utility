name: Compile GoXLR.exe & Create Release

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build-and-release:
    name: Build GoXLR.exe Installer & Create Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build GoXLR Installer (release)
        shell: pwsh
        run: |
          .\build-release.ps1
          if (!(Test-Path "build-output/GoXLR.exe")) {
            throw "GoXLR.exe was not found in build-output!"
          }

      - name: Determine Next Incrementing Version
        id: get_version
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $cargoContent = Get-Content -Path "Cargo.toml" -Raw
          $baseVer = "1.2.4"
          if ($cargoContent -match 'version\s*=\s*"([^"]+)"') {
            $baseVer = $matches[1]
          }
          $baseParts = $baseVer.Split('.')
          $baseMajor = [int]$baseParts[0]
          $baseMinor = [int]$baseParts[1]
          $basePatch = [int]$baseParts[2]

          $maxMajor = $baseMajor
          $maxMinor = $baseMinor
          $maxPatch = $basePatch - 1
          $hasReleases = $false

          try {
            $releasesJson = gh release list --limit 100 --json tagName | ConvertFrom-Json
            foreach ($rel in $releasesJson) {
              $tag = $rel.tagName
              if ($tag -match '^v?(\d+)\.(\d+)\.(\d+)$') {
                $hasReleases = $true
                $maj = [int]$matches[1]
                $min = [int]$matches[2]
                $pat = [int]$matches[3]

                if ($maj -gt $maxMajor) {
                  $maxMajor = $maj
                  $maxMinor = $min
                  $maxPatch = $pat
                } elseif ($maj -eq $maxMajor -and $min -gt $maxMinor) {
                  $maxMinor = $min
                  $maxPatch = $pat
                } elseif ($maj -eq $maxMajor -and $min -eq $maxMinor -and $pat -gt $maxPatch) {
                  $maxPatch = $pat
                }
              }
            }
          } catch {
            Write-Host "No existing releases found or error fetching releases: $_"
          }

          if ($hasReleases) {
            if ($maxMajor -gt $baseMajor -or ($maxMajor -eq $baseMajor -and $maxMinor -gt $baseMinor)) {
              $nextMajor = $maxMajor
              $nextMinor = $maxMinor
              $nextPatch = $maxPatch + 1
            } elseif ($maxMajor -eq $baseMajor -and $maxMinor -eq $baseMinor) {
              if ($maxPatch -ge $basePatch) {
                $nextMajor = $baseMajor
                $nextMinor = $baseMinor
                $nextPatch = $maxPatch + 1
              } else {
                $nextMajor = $baseMajor
                $nextMinor = $baseMinor
                $nextPatch = $basePatch
              }
            } else {
              $nextMajor = $baseMajor
              $nextMinor = $baseMinor
              $nextPatch = $basePatch
            }
          } else {
            $nextMajor = $baseMajor
            $nextMinor = $baseMinor
            $nextPatch = $basePatch
          }

          $ver = "$nextMajor.$nextMinor.$nextPatch"
          $tag = "v$ver"
          Write-Host "Determined next version: $ver ($tag)"
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create Release and Upload GoXLR.exe
        uses: softprops/action-gh-release@v2
        with:
          name: GoXLR Release ${{ steps.get_version.outputs.tag }}
          tag_name: ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build-output/GoXLR.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
