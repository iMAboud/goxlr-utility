name: Compile GoXLR.exe & Create Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build GoXLR.exe Installer & Create Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build GoXLR Installer (release)
        shell: pwsh
        run: |
          cargo build --release --bin GoXLR
          if (!(Test-Path "target/release/GoXLR.exe")) {
            throw "GoXLR.exe was not found in target/release!"
          }

      - name: Extract Cargo Version
        id: get_version
        shell: pwsh
        run: |
          $cargoContent = Get-Content -Path "Cargo.toml" -Raw
          if ($cargoContent -match 'version\s*=\s*"([^"]+)"') {
            $ver = $matches[1]
            echo "version=$ver" >> $env:GITHUB_OUTPUT
            echo "tag=v$ver" >> $env:GITHUB_OUTPUT
          } else {
            echo "version=1.2.4" >> $env:GITHUB_OUTPUT
            echo "tag=v1.2.4" >> $env:GITHUB_OUTPUT
          }

      - name: Create Release and Upload GoXLR.exe
        uses: softprops/action-gh-release@v2
        with:
          name: GoXLR Release ${{ steps.get_version.outputs.tag }}
          tag_name: ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            target/release/GoXLR.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
